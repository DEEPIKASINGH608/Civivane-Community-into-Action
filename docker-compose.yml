version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: civivane_db
    environment:
      POSTGRES_USER: civivane_admin
      POSTGRES_PASSWORD: civivane_secret_password
      POSTGRES_DB: civivane_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: civivane_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: